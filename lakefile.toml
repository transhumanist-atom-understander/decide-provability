name = "decide-provability"
defaultTargets = ["GLTableau", "WitnessTableau"]

[[lean_lib]]
name = "GLTableau"

[[lean_lib]]
name = "WitnessTableau"

# The Lean REPL that the Python package `lean-interact` drives, at the tag for this toolchain:
# the wrapper runs it in this project, with one of the libraries imported.
[[require]]
name = "REPL"
git = "https://github.com/augustepoiroux/repl"
rev = "v1.3.19_lean-toolchain-v4.34.0"
