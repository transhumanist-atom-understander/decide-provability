name = "decide-provability"
defaultTargets = ["RTableau", "repl"]

[[lean_lib]]
name = "RTableau"

# The Lean REPL that the Python package `lean-interact` drives, at the tag for this toolchain:
# the wrapper runs it in this project, with `RTableau` imported.
[[require]]
name = "REPL"
git = "https://github.com/augustepoiroux/repl"
rev = "v1.3.19_lean-toolchain-v4.34.0"

# That REPL with `RTableau` linked in, so that what it evaluates of the library runs as compiled
# code: the REPL's own executable would run it in Lean's interpreter.
[[lean_exe]]
name = "repl"
root = "Main"
supportInterpreter = true
